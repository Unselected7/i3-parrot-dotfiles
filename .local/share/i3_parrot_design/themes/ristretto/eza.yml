# eza color theme
# Automatically loaded via ~/.config/eza/theme.yml symlink

# Colors follow dircolors syntax
# Format: "attribute;foreground;background" or just "foreground"

# File types
di: "1;34"      # Directories (bold blue)
ln: "1;36"      # Symlinks (bold cyan)
ex: "1;32"      # Executables (bold green)
fi: "0"         # Regular files (default)

# Archives
*.tar: "1;31"   # Bold red
*.zip: "1;31"
*.gz: "1;31"
*.7z: "1;31"
*.rar: "1;31"

# Images
*.jpg: "1;35"   # Bold magenta
*.png: "1;35"
*.gif: "1;35"
*.svg: "1;35"
*.webp: "1;35"

# Code
*.sh: "32"      # Green
*.py: "32"
*.js: "33"      # Yellow
*.ts: "33"
*.md: "36"      # Cyan
*.html: "33"
*.css: "35"

# Config
*.conf: "33"    # Yellow
*.toml: "33"
*.yml: "33"
*.yaml: "33"
*.json: "33"
*.xml: "33"
